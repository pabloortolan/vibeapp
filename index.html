<script>
'use strict';

// ── PRNG ──────────────────────────────────────────────────────────────────────
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function strToSeed(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function seededShuffle(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ── Date ──────────────────────────────────────────────────────────────────────

  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateFR(s) {
  const [y,m,d] = s.split('-');
  const M = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${+d} ${M[+m-1]} ${y}`;
}
function fmtTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

// ── NLP ───────────────────────────────────────────────────────────────────────
function stripAccents(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }

function extractWords(text, rng) {
  text = text.replace(/<[^>]+>/g,' ').replace(/\([^)]{0,150}\)/g,' ').replace(/\[[^\]]{0,60}\]/g,' ');
  const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 25);
  const map = new Map();
  for (const sent of sentences) {
    const tokens = sent.match(/[A-Za-zÀ-ÿ]{4,10}/g) || [];
    for (const tok of tokens) {
      const norm = stripAccents(tok.toUpperCase());
      if (!/^[A-Z]{4,10}$/.test(norm)) continue;
      const low = stripAccents(tok.toLowerCase());
      if (STOPS.has(low) || STOPS.has(tok.toLowerCase())) continue;
      if (!map.has(norm)) {
        const clue = sent.replace(new RegExp('\\b'+tok+'\\b','gi'),'______').trim();
        if (clue.includes('______') && clue.length > 15) map.set(norm,{word:norm,clue});
      }
    }
  }
  return seededShuffle([...map.values()], rng).slice(0, 30);
}

// ── Wikipedia fetch ───────────────────────────────────────────────────────────
async function fetchWiki(dateStr, rng) {
  const [y,m,d] = dateStr.split('-');
  try {
    const r = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/featured/${y}/${m}/${d}`,
      {headers:{Accept:'application/json'}});
    if (!r.ok) throw 0;
    const data = await r.json();
    let txt = '';
    if (data.tfa?.extract)      txt += data.tfa.extract + ' ';
    if (data.mostread?.articles) data.mostread.articles.slice(0,6).forEach(a => { if(a.extract) txt+=a.extract+' '; });
    if (data.news)               data.news.slice(0,4).forEach(n => { if(n.story) txt+=n.story+' '; });
    if (txt.length < 400) throw 0;
    const words = extractWords(txt, rng);
    if (words.length < 14) throw 0;
    return { words, title: data.tfa?.title || '' };
  } catch {
    return null;
  }
}

// ── Grid builder ──────────────────────────────────────────────────────────────
class Grid {
  constructor(rng) { this.rng=rng; this.g=new Map(); this.placed=[]; }
  key(r,c){return r+','+c;}
  at(r,c){return this.g.get(this.key(r,c));}
  put(r,c,l){this.g.set(this.key(r,c),l);}

  build(words) {
    const sorted = [...words].sort((a,b)=>b.word.length-a.word.length);
    this._place(sorted[0],0,0,'across');
    for (let i=1;i<sorted.length;i++) this._try(sorted[i]);
    return this.placed;
  }

  _place(wo,row,col,dir) {
    const cells=[];
    for(let i=0;i<wo.word.length;i++){
      const r=dir==='across'?row:row+i, c=dir==='across'?col+i:col;
      this.put(r,c,wo.word[i]); cells.push({r,c});
    }
    this.placed.push({...wo,row,col,dir,cells,number:0});
  }

  _canPlace(word,row,col,dir){
    for(let i=0;i<word.length;i++){
      const r=dir==='across'?row:row+i, c=dir==='across'?col+i:col;
      const ex=this.at(r,c);
      if(ex!==undefined){if(ex!==word[i])return false;}
      else{
        if(dir==='across'){if(this.at(r-1,c)!==undefined||this.at(r+1,c)!==undefined)return false;}
        else{if(this.at(r,c-1)!==undefined||this.at(r,c+1)!==undefined)return false;}
      }
    }
    if(dir==='across'){if(this.at(row,col-1)!==undefined||this.at(row,col+word.length)!==undefined)return false;}
    else{if(this.at(row-1,col)!==undefined||this.at(row+word.length,col)!==undefined)return false;}
    return true;
  }

  _try(wo) {
    const {word}=wo; const cands=[];
    for(const p of this.placed){
      const nd=p.dir==='across'?'down':'across';
      for(let pi=0;pi<p.word.length;pi++)for(let wi=0;wi<word.length;wi++){
        if(p.word[pi]!==word[wi])continue;
        const row=nd==='down'?p.row-wi:p.row+pi, col=nd==='down'?p.col+pi:p.col-wi;
        if(!this._canPlace(word,row,col,nd))continue;
        let sc=0; for(let i=0;i<word.length;i++){const r=nd==='across'?row:row+i,c=nd==='across'?col+i:col;if(this.at(r,c))sc++;}
        cands.push({row,col,dir:nd,sc});
      }
    }
    if(!cands.length)return false;
    cands.sort((a,b)=>b.sc-a.sc||(this.rng()-0.5));
    this._place(wo,cands[0].row,cands[0].col,cands[0].dir);
    return true;
  }

  bounds(){
    let r0=Infinity,r1=-Infinity,c0=Infinity,c1=-Infinity;
    for(const k of this.g.keys()){const[r,c]=k.split(',').map(Number);r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
    return{r0,r1,c0,c1};
  }
}

function buildGrid(words, seed) {
  for (let attempt=0;attempt<12;attempt++){
    const rng=mulberry32(seed+attempt*7919);
    const shuffled=seededShuffle(words,rng).slice(0,26);
    const g=new Grid(rng);
    const placed=g.build(shuffled);
    if(placed.length>=15){
      const use=placed.slice(0,20);
      // Rebuild clean grid from only used words
      const clean=new Map();
      for(const p of use) for(let i=0;i<p.word.length;i++){const{r,c}=p.cells[i];clean.set(r+','+c,p.word[i]);}
      return{placed:use,gridMap:clean,bounds:g.bounds()};
    }
  }
  return null;
}

// ── Number cells ──────────────────────────────────────────────────────────────
function numberWords(placed) {
  const starts=new Map();
  for(const p of placed) starts.set(p.row+','+p.col,true);
  const sorted=[...starts.keys()].sort((a,b)=>{const[ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar!==br?ar-br:ac-bc;});
  const numMap=new Map(); sorted.forEach((k,i)=>numMap.set(k,i+1));
  const across=[],down=[];
  for(const p of placed){p.number=numMap.get(p.row+','+p.col);(p.dir==='across'?across:down).push(p);}
  across.sort((a,b)=>a.number-b.number); down.sort((a,b)=>a.number-b.number);
  return{numMap,across,down};
}

// ── App state ─────────────────────────────────────────────────────────────────
const S = {
  dateStr:'', placed:[], across:[], down:[], numMap:new Map(), gridMap:new Map(), bounds:null,
  userInput:new Map(), sel:null, dir:'across',
  secs:0, timerID:null, done:false,
};

// ── localStorage ──────────────────────────────────────────────────────────────
const LSKEY = ()=>'mots-croises-'+S.dateStr;
function save(){try{localStorage.setItem(LSKEY(),JSON.stringify({inp:[...S.userInput],secs:S.secs,done:S.done}));}catch{}}
function load(){try{const d=JSON.parse(localStorage.getItem(LSKEY())||'null');if(!d)return false;S.userInput=new Map(d.inp||[]);S.secs=d.secs||0;S.done=!!d.done;return true;}catch{return false;}}

// ── Timer ─────────────────────────────────────────────────────────────────────
function startTimer(){if(S.timerID)return;S.timerID=setInterval(()=>{if(!S.done){S.secs++;document.getElementById('timer').textContent=fmtTime(S.secs);if(S.secs%15===0)save();}},1000);}
function stopTimer(){clearInterval(S.timerID);S.timerID=null;}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _tID;
function toast(msg,ms=2600){
  const el=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(_tID); _tID=setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(6px)';},ms);
}

// ── Highlight ─────────────────────────────────────────────────────────────────
function wordAt(r,c,dir){return S.placed.find(p=>p.dir===dir&&p.cells.some(cl=>cl.r===r&&cl.c===c));}
function inp(r,c){return document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);}

function highlight(){
  document.querySelectorAll('.gc-inp').forEach(el=>el.classList.remove('word-hi','cell-hi'));
  document.querySelectorAll('.clue-row').forEach(el=>el.classList.remove('active'));
  if(!S.sel)return;
  const{r,c}=S.sel; const w=wordAt(r,c,S.dir);
  if(w){
    w.cells.forEach(cl=>{const el=inp(cl.r,cl.c);if(el)el.classList.add('word-hi');});
    const ce=inp(r,c); if(ce){ce.classList.remove('word-hi');ce.classList.add('cell-hi');}
    const cl=document.getElementById(`cl-${w.dir}-${w.number}`);
    if(cl){cl.classList.add('active');cl.scrollIntoView({block:'nearest',behavior:'smooth'});}
  } else {
    const ce=inp(r,c); if(ce) ce.classList.add('cell-hi');
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
function moveTo(r,c){if(S.gridMap.has(r+','+c)){S.sel={r,c};highlight();inp(r,c)?.focus();}}
function advance(r,c){const dr=S.dir==='down'?1:0,dc=S.dir==='across'?1:0;moveTo(r+dr,c+dc);}
function retreat(r,c){const dr=S.dir==='down'?-1:0,dc=S.dir==='across'?-1:0;moveTo(r+dr,c+dc);}

// ── Events ────────────────────────────────────────────────────────────────────
function onCellClick(r,c){
  if(S.done)return;
  if(S.sel&&S.sel.r===r&&S.sel.c===c){const opp=S.dir==='across'?'down':'across';if(wordAt(r,c,opp))S.dir=opp;}
  else{if(!wordAt(r,c,S.dir)){const opp=S.dir==='across'?'down':'across';if(wordAt(r,c,opp))S.dir=opp;}}
  S.sel={r,c}; highlight();
}
function onKeyDown(e,r,c){
  if(S.done)return;
  if(e.key==='ArrowRight'){e.preventDefault();moveTo(r,c+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();moveTo(r,c-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();moveTo(r+1,c);}
  else if(e.key==='ArrowUp'){e.preventDefault();moveTo(r-1,c);}
  else if(e.key==='Tab'){e.preventDefault();const opp=S.dir==='across'?'down':'across';if(wordAt(r,c,opp)){S.dir=opp;highlight();}}
  else if(e.key==='Backspace'){
    e.preventDefault();
    const el=inp(r,c);
    if(el&&el.value){el.value='';S.userInput.delete(r+','+c);updateBtn();save();}
    else{retreat(r,c);const ps=S.sel;if(ps){const pi=inp(ps.r,ps.c);if(pi&&pi.value){pi.value='';S.userInput.delete(ps.r+','+ps.c);updateBtn();save();}}}
  }
}
function onInput(e,r,c){
  if(S.done)return;
  const el=e.target, raw=el.value.toUpperCase().replace(/[^A-Z]/g,'');
  el.value=raw?raw[raw.length-1]:'';
  if(el.value){S.userInput.set(r+','+c,el.value);advance(r,c);}
  else S.userInput.delete(r+','+c);
  updateBtn(); save();
}

// ── Verify button state ───────────────────────────────────────────────────────
function updateBtn(){
  const filled=[...S.gridMap.keys()].every(k=>{const v=S.userInput.get(k);return v&&v.length>0;});
  const btn=document.getElementById('verify-btn');
  if(filled){
    btn.disabled=false;
    btn.className='px-3.5 py-1.5 rounded-lg text-sm font-semibold border transition-all duration-150 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white border-emerald-500 cursor-pointer';
  } else {
    btn.disabled=true;
    btn.className='px-3.5 py-1.5 rounded-lg text-sm font-semibold border transition-all duration-150 bg-zinc-900 text-zinc-600 border-zinc-800 cursor-not-allowed';
  }
}

// ── Verify ────────────────────────────────────────────────────────────────────
function verify(){
  const ok=[...S.gridMap.entries()].every(([k,correct])=>S.userInput.get(k)===correct);
  if(ok){S.done=true;stopTimer();save();showModal();}
  else toast('La grille contient des erreurs.');
}

// ── Success modal ─────────────────────────────────────────────────────────────
function showModal(){
  document.getElementById('modal-time').textContent=fmtTime(S.secs);
  const[y,m,d]=S.dateStr.split('-');
  document.getElementById('modal-date').textContent=`${d}/${m}/${y}`;
  document.getElementById('modal').classList.remove('hidden');
}

// ── Share ─────────────────────────────────────────────────────────────────────
function share(){
  const[y,m,d]=S.dateStr.split('-');
  const txt=[
    'Mots Croisés du Jour 🧩',
    `Date : ${d}/${m}/${y}`,
    `Temps : ${fmtTime(S.secs)} ⏱️`,
    'Difficulté : Hardcore (Sans indices révélés)',
    '',
    '🟩'.repeat(9),
    '',
    'https://pabloortolan.github.io/vibeapp',
  ].join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Copié dans le presse-papiers !')).catch(()=>toast('Impossible de copier.'));
}

// ── Render grid ───────────────────────────────────────────────────────────────
function renderGrid(){
  const{r0,r1,c0,c1}=S.bounds;
  const cols=c1-c0+1, rows=r1-r0+1;
  const el=document.getElementById('crossword-grid');
  el.innerHTML='';
  el.style.gridTemplateColumns=`repeat(${cols},36px)`;
  el.style.gridTemplateRows=`repeat(${rows},36px)`;

  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const letter=S.gridMap.get(r+','+c);
    if(!letter){const b=document.createElement('div');b.className='gc-black';el.appendChild(b);continue;}
    const wrap=document.createElement('div'); wrap.className='gc-wrap';
    const num=S.numMap.get(r+','+c);
    if(num){const ns=document.createElement('span');ns.className='gc-num';ns.textContent=num;wrap.appendChild(ns);}
    const input=document.createElement('input');
    input.className='gc-inp'; input.type='text'; input.maxLength=1;
    input.autocomplete='off'; input.autocorrect='off'; input.autocapitalize='characters'; input.spellcheck=false;
    input.dataset.r=r; input.dataset.c=c;
    const saved=S.userInput.get(r+','+c); if(saved)input.value=saved;
    input.addEventListener('click',()=>onCellClick(r,c));
    input.addEventListener('keydown',e=>onKeyDown(e,r,c));
    input.addEventListener('input',e=>onInput(e,r,c));
    wrap.appendChild(input); el.appendChild(wrap);
  }
}

// ── Render clues ──────────────────────────────────────────────────────────────
function renderClues(){
  function make(item){
    const d=document.createElement('div'); d.className='clue-row'; d.id=`cl-${item.dir}-${item.number}`;
    const ns=document.createElement('span'); ns.className='clue-num'; ns.textContent=item.number+'.';
    const ts=document.createElement('span'); ts.className='playfair clue-txt';
    ts.textContent=(item.clue.length>130?item.clue.slice(0,127)+'…':item.clue)+` (${item.word.length})`;
    d.appendChild(ns); d.appendChild(ts);
    d.addEventListener('click',()=>{
      S.dir=item.dir; S.sel={r:item.row,c:item.col}; highlight();
      // Jump to first empty cell in this word
      for(const cl of item.cells){if(!S.userInput.get(cl.r+','+cl.c)){moveTo(cl.r,cl.c);return;}}
      moveTo(item.row,item.col);
    });
    return d;
  }
  const ac=document.getElementById('clues-across'), dn=document.getElementById('clues-down');
  ac.innerHTML=''; dn.innerHTML='';
  S.across.forEach(w=>ac.appendChild(make(w)));
  S.down.forEach(w=>dn.appendChild(make(w)));
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const dateStr=todayStr(); S.dateStr=dateStr;
  document.getElementById('hdr-date').textContent=fmtDateFR(dateStr);
  document.getElementById('timer').textContent='00:00';

  const seed=strToSeed(dateStr);
  const rng=mulberry32(seed);

  // Fetch Wikipedia
  const wiki=await fetchWiki(dateStr,rng);
  let wordList=wiki?.words||null;
  let sourceNote='';

  if(!wordList||wordList.length<14){wordList=GOLF;sourceNote='Thème du jour : Le Golf';}
  else if(wiki?.title) sourceNote=`Source : ${wiki.title}`;

  // Build grid (retry until 15+ words or fall back to golf)
  let result=buildGrid(wordList,seed);
  if(!result){wordList=GOLF;result=buildGrid(wordList,seed);}
  if(!result){
    document.getElementById('loading').innerHTML='<p class="text-red-500 text-sm">Erreur de génération. Veuillez recharger la page.</p>';
    return;
  }

  S.placed=result.placed; S.gridMap=result.gridMap; S.bounds=result.bounds;
  const{numMap,across,down}=numberWords(S.placed);
  S.numMap=numMap; S.across=across; S.down=down;

  // Load saved state
  load();

  // Show UI
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('source-note').textContent=sourceNote;

  renderGrid();
  renderClues();
  updateBtn();
  document.getElementById('timer').textContent=fmtTime(S.secs);

  if(S.done){
    // Restore completed state
    const btn=document.getElementById('verify-btn');
    btn.textContent='✓ Résolu'; btn.disabled=true;
    btn.className='px-3.5 py-1.5 rounded-lg text-sm font-semibold border bg-zinc-900 text-emerald-600 border-zinc-800 cursor-default';
    setTimeout(showModal,400);
  } else {
    startTimer();
    // Select first word
    if(S.across.length){const f=S.across[0];S.dir='across';S.sel={r:f.row,c:f.col};highlight();}
  }

  document.getElementById('verify-btn').addEventListener('click',()=>{if(!S.done&&!document.getElementById('verify-btn').disabled)verify();});
  document.getElementById('share-btn').addEventListener('click',share);
}

init();
</script>
