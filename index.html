<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mots Croisés du Jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Rose Pine Dawn (light) */
:root {
  --bg:        #faf4ed;
  --surface:   #fffaf3;
  --border:    #ddd8cf;
  --border2:   #c8c3ba;
  --text:      #575279;
  --muted:     #9893a5;
  --accent:    #b4637a;
  --blue:      #907aa9;
  --emerald:   #286983;
  --rose:      #d7827a;
  --cell-bg:   #fffaf3;
  --cell-hover:#f2e9e1;
  --cell-sel:  #e8d0da;
  --cell-word: #f2e4ea;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── MASTHEAD ── */
.masthead {
  padding: 18px 0 0;
}
.masthead-inner {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 16px 14px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}
/* Single line ending at the right edge of the grid column */
.masthead-inner::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 16px;
  width: calc(100% - 340px - 32px - 16px);
  height: 1px;
  background: var(--border2);
}
.masthead-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--accent);
  line-height: 1;
}
.masthead-sub {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.masthead-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 1px;
}
.tries-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--muted);
  font-weight: 500;
}

/* ── LAYOUT ── */
.app {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  gap: 32px;
}
.left-col { flex: 1; min-width: 0; }
.right-col {
  width: 340px;
  flex-shrink: 0;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  position: sticky;
  top: 20px;
  align-self: flex-start;
}

/* ── SECTION LABELS ── */
.section-label {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 10px;
}

/* ── GRID ── */
.grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.crossword-grid {
  display: inline-grid;
  gap: 2px;
  background: var(--border2);
  padding: 2px;
}
.cell {
  width: 38px; height: 38px;
  background: var(--border2);
  position: relative;
}
.cell.white { background: var(--cell-bg); }
.cell.white:hover { background: var(--cell-hover); cursor: pointer; }
.cell.white.word-active { background: var(--cell-word); }
.cell.white.active { background: var(--cell-sel); }
.cell.correct { background: #d8ead4 !important; }

.cell input {
  position: absolute; inset: 0;
  background: transparent;
  border: none; outline: none;
  width: 100%; height: 100%;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  caret-color: transparent;
  cursor: default;
}
.cell-num {
  position: absolute;
  top: 2px; left: 3px;
  font-size: 7px;
  line-height: 1;
  color: var(--muted);
  pointer-events: none;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
}

/* ── ACTIONS ── */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px;
  border-radius: 3px;
  font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer; border: none;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}
.btn-verify {
  background: var(--accent);
  color: #faf4ed;
}
.btn-verify:hover { background: #c4738a; }
.btn-erase {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border2);
}
.btn-erase:hover { background: var(--cell-hover); }
.btn-share {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border2);
}
.btn-share:hover { background: var(--cell-hover); }
.btn-copied {
  background: #286983 !important;
  color: #faf4ed !important;
  border-color: #286983 !important;
}

/* ── CLUES ── */
.clue-list { display: flex; flex-direction: column; }
.clue-item {
  display: flex;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 2px solid transparent;
  font-size: 13px;
  line-height: 1.45;
}
.clue-item:hover { background: var(--cell-hover); }
.clue-item.active {
  background: var(--cell-word);
  border-left-color: var(--accent);
}
.clue-num {
  font-weight: 700;
  color: var(--accent);
  min-width: 22px;
  flex-shrink: 0;
  font-size: 12px;
  padding-top: 1px;
}
.clue-text { color: var(--text); }

/* ── MOBILE CLUE BAR ── */
#mobile-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border2);
  padding: 12px 12px 16px;
  z-index: 60;
  transform: translateY(100%);
  transition: transform 0.22s cubic-bezier(.4,0,.2,1);
}
#mobile-bar.open { transform: translateY(0); }
.mobile-bar-dir {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent);
  margin-bottom: 4px;
}
.mobile-bar-clue {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  color: var(--text);
  line-height: 1.4;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #f9ece8;
  color: #b4637a;
  border: 1px solid #d7827a;
  padding: 10px 18px;
  border-radius: 3px;
  font-size: 13px; font-weight: 500;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  z-index: 80;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── MODAL ── */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(87,82,121,0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
#modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-top: 3px solid var(--accent);
  border-radius: 4px;
  padding: 36px 32px;
  max-width: 380px; width: 90%;
  text-align: center;
}
.modal-icon { font-size: 40px; margin-bottom: 14px; }
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
}
.modal-stat {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}
.modal-actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; }
.btn-modal-share {
  background: var(--accent);
  color: #faf4ed;
  padding: 10px 24px;
  border-radius: 3px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  border: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.btn-modal-share:hover { background: #c4738a; }
.btn-modal-close {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border2);
  padding: 10px 20px;
  border-radius: 3px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
}

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .masthead { padding: 14px 0 0; }
  .masthead-inner { padding: 0 12px 12px; }
  .masthead-inner::after { width: 55%; left: 12px; }
  .app { padding: 14px 12px 40px; }
  .right-col { display: none; }
  #toast { bottom: 80px; }
  .cell { width: 30px; height: 30px; }
  .cell input { font-size: 13px; }
  .left-col { display: flex; flex-direction: column; }
  .actions { order: -1; margin-top: 0; margin-bottom: 12px; }
}
</style>
</head>
<body>

<!-- Masthead -->
<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="masthead-title">Mots Croisés</div>
      <div class="masthead-sub" id="theme-sub">du Jour</div>
    </div>
    <div class="masthead-meta">
      <span class="timer" id="timer">00:00</span>
      <span class="tries-badge" id="tries-badge">0 essai</span>
    </div>
  </div>
</header>

<!-- App body -->
<div class="app">
  <!-- Left: grid + buttons -->
  <div class="left-col">
    <div class="grid-scroll">
      <div id="grid" class="crossword-grid"></div>
    </div>
    <div class="actions">
      <button class="btn btn-verify" onclick="verify()">Vérifier</button>
      <button class="btn btn-erase" onclick="eraseAll()">Effacer</button>
      <button class="btn btn-share" id="share-btn" onclick="share()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span id="share-text">Partager</span>
      </button>
    </div>
  </div>

  <!-- Right: clue lists (desktop) -->
  <div class="right-col">
    <div style="margin-bottom: 24px;">
      <div class="section-label">Horizontalement</div>
      <div class="clue-list" id="clues-h"></div>
    </div>
    <div>
      <div class="section-label">Verticalement</div>
      <div class="clue-list" id="clues-v"></div>
    </div>
  </div>
</div>

<!-- Mobile clue bar -->
<div id="mobile-bar">
  <div class="mobile-bar-dir" id="mb-dir"></div>
  <div class="mobile-bar-clue" id="mb-clue"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Success modal -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-icon">🌸</div>
    <div class="modal-title">Félicitations !</div>
    <p class="modal-stat" id="m-time"></p>
    <p class="modal-stat" id="m-tries"></p>
    <div class="modal-actions">
      <button class="btn-modal-share" id="modal-share-btn" onclick="modalShare()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span id="modal-share-text">Partager</span>
      </button>
      <button class="btn-modal-close" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
const S = {
  dateStr: '', theme: '', isFallback: false,
  rows: 0, cols: 0,
  words: [],
  grid: new Map(),
  nums: new Map(),
  wmap: new Map(),
  input: new Map(),
  sel: null, dir: 'H',
  secs: 0, tid: null, done: false, tries: 0
};

function key(r, c) { return `${r},${c}`; }
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function fmtTime(secs) {
  const m = String(Math.floor(secs/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  return `${m}:${s}`;
}
function cellEl(r, c) { return document.querySelector(`[data-r="${r}"][data-c="${c}"]`); }

function updateBarPosition() {
  if (!window.visualViewport) return;
  const bar = document.getElementById('mobile-bar');
  const offset = window.innerHeight - window.visualViewport.offsetTop - window.visualViewport.height;
  bar.style.bottom = Math.max(0, offset) + 'px';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', updateBarPosition);
  window.visualViewport.addEventListener('scroll', updateBarPosition);
}

function showError(msg) {
  document.body.innerHTML = `<div style="padding:3rem 2rem;font-family:Georgia,serif;color:#575279;max-width:480px;margin:0 auto">
    <div style="font-size:2rem;margin-bottom:1rem">⚠️</div>
    <p style="font-size:1.1rem;font-weight:bold;color:#b4637a;margin-bottom:.5rem">Puzzle introuvable</p>
    <p style="font-size:.9rem;color:#9893a5">${msg}</p>
    <button onclick="location.reload()" style="margin-top:1.5rem;padding:10px 20px;background:#b4637a;color:#faf4ed;border:none;border-radius:3px;font-size:.9rem;cursor:pointer">Réessayer</button>
  </div>`;
}

async function boot() {
  S.dateStr = today();
  let data = null;
  try { const r = await fetch(`data/${S.dateStr}.json`); if (r.ok) data = await r.json(); } catch(e) {}
  if (!data) {
    S.isFallback = true;
    try { const r = await fetch('data/golf-fallback.json'); if (r.ok) data = await r.json(); } catch(e) {}
  }
  if (!data) { showError('Impossible de charger le puzzle. Vérifiez votre connexion et rechargez la page.'); return; }
  try { init(data); } catch(e) { showError(`Erreur lors du chargement : ${e.message}`); }
}

function init(data) {
  S.theme = data.theme || '';
  S.rows = data.gridSize.rows;
  S.cols = data.gridSize.cols;
  S.words = data.words.map(w => ({ ...w, word: w.word.toUpperCase() }));

  const sub = document.getElementById('theme-sub');
  if (!S.isFallback) {
    sub.textContent = S.theme ? `${fmtDate(S.dateStr)} · ${S.theme}` : fmtDate(S.dateStr);
  } else {
    sub.textContent = S.theme ? `Thème : ${S.theme}` : 'du Jour';
  }

  S.grid.clear(); S.nums.clear(); S.wmap.clear();
  S.words.forEach((w, wi) => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'H' ? w.row : w.row + i;
      const c = w.direction === 'H' ? w.col + i : w.col;
      const k = key(r, c);
      S.grid.set(k, w.word[i]);
      if (!S.wmap.has(k)) S.wmap.set(k, []);
      S.wmap.get(k).push({ wi, pos: i });
    }
  });

  const seen = new Map(); let n = 1;
  S.words.map((w, wi) => ({ r: w.row, c: w.col, wi }))
    .sort((a, b) => a.r !== b.r ? a.r - b.r : a.c - b.c)
    .forEach(({ r, c, wi }) => {
      const k = key(r, c);
      if (!seen.has(k)) { seen.set(k, n); S.nums.set(k, n); n++; }
      S.words[wi].num = seen.get(k);
    });

  const saved = loadSave();
  S.input = saved?.inp ?? new Map();
  S.secs  = saved?.secs ?? 0;
  S.done  = saved?.done ?? false;
  S.tries = saved?.tries ?? 0;

  buildGrid();
  buildClues();
  updateTries();
  updateTimer();
  if (!S.done) startTimer(); else markDone();
}

function buildGrid() {
  const el = document.getElementById('grid');
  el.style.gridTemplateColumns = `repeat(${S.cols}, auto)`;
  el.innerHTML = '';
  for (let r = 1; r <= S.rows; r++) {
    for (let c = 1; c <= S.cols; c++) {
      const k = key(r, c);
      const div = document.createElement('div');
      div.className = S.grid.has(k) ? 'cell white' : 'cell';
      div.dataset.r = r; div.dataset.c = c;
      if (S.grid.has(k)) {
        const num = S.nums.get(k);
        if (num) {
          const span = document.createElement('span');
          span.className = 'cell-num'; span.textContent = num;
          div.appendChild(span);
        }
        const inp = document.createElement('input');
        inp.type = 'text'; inp.maxLength = 1;
        inp.autocomplete = 'off'; inp.autocorrect = 'off';
        inp.autocapitalize = 'characters'; inp.spellcheck = false;
        inp.value = S.input.get(k) || '';
        inp.addEventListener('mousedown', e => { e.preventDefault(); tap(r, c); });
        inp.addEventListener('touchstart', e => { e.preventDefault(); tap(r, c); }, { passive: false });
        inp.addEventListener('keydown', e => kdown(e, r, c));
        inp.addEventListener('input', e => kinput(e, r, c));
        div.appendChild(inp);
      }
      el.appendChild(div);
    }
  }
  highlight();
}

function highlight() {
  document.querySelectorAll('.cell.white').forEach(el => el.classList.remove('active', 'word-active'));
  if (!S.sel) return;
  const { r, c } = S.sel;
  const entries = S.wmap.get(key(r, c)) || [];
  const entry = entries.find(e => S.words[e.wi].direction === S.dir) || entries[0];
  if (entry) {
    const w = S.words[entry.wi];
    for (let i = 0; i < w.word.length; i++) {
      const wr = w.direction === 'H' ? w.row : w.row + i;
      const wc = w.direction === 'H' ? w.col + i : w.col;
      const el = cellEl(wr, wc);
      if (el) el.classList.add('word-active');
    }
    showMobileClue(w);
    highlightClue(entry.wi);
  }
  const sel = cellEl(r, c);
  if (sel) { sel.classList.remove('word-active'); sel.classList.add('active'); }
  focusCell(r, c);
}

function focusCell(r, c) {
  const el = cellEl(r, c);
  if (el) { const inp = el.querySelector('input'); if (inp) inp.focus({ preventScroll: true }); }
}

function buildClues() {
  const ch = document.getElementById('clues-h');
  const cv = document.getElementById('clues-v');
  ch.innerHTML = ''; cv.innerHTML = '';
  const sorted = S.words.map((w, wi) => ({ w, wi })).sort((a, b) => a.w.num - b.w.num);
  sorted.forEach(({ w, wi }) => {
    const div = document.createElement('div');
    div.className = 'clue-item'; div.dataset.wi = wi;
    div.innerHTML = `<span class="clue-num">${w.num}.</span><span class="clue-text">${w.clue}</span>`;
    div.addEventListener('click', () => selectWord(wi));
    (w.direction === 'H' ? ch : cv).appendChild(div);
  });
}

function highlightClue(wi) {
  document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.clue-item[data-wi="${wi}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function selectWord(wi) {
  const w = S.words[wi]; S.sel = { r: w.row, c: w.col }; S.dir = w.direction; highlight();
}

function showMobileClue(w) {
  document.getElementById('mb-dir').textContent =
    `${w.num}. ${w.direction === 'H' ? 'Horizontalement' : 'Verticalement'}`;
  document.getElementById('mb-clue').textContent = w.clue;
  document.getElementById('mobile-bar').classList.add('open');
  updateBarPosition();
}

function tap(r, c) {
  if (!S.grid.has(key(r, c)) || S.done) return;
  if (S.sel?.r === r && S.sel?.c === c) {
    const dirs = new Set((S.wmap.get(key(r, c)) || []).map(e => S.words[e.wi].direction));
    if (dirs.size > 1) S.dir = S.dir === 'H' ? 'V' : 'H';
  } else {
    S.sel = { r, c };
    const entries = S.wmap.get(key(r, c)) || [];
    if (entries.length && !entries.find(e => S.words[e.wi].direction === S.dir))
      S.dir = S.words[entries[0].wi].direction;
  }
  highlight();
}

function kdown(e, r, c) {
  if (S.done) return;
  if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
    e.target.value = '';
    return;
  }
  if (e.key === 'ArrowRight') { e.preventDefault(); move(r, c, 0, 1); return; }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); move(r, c, 0,-1); return; }
  if (e.key === 'ArrowDown')  { e.preventDefault(); move(r, c, 1, 0); return; }
  if (e.key === 'ArrowUp')    { e.preventDefault(); move(r, c,-1, 0); return; }
  if (e.key === 'Tab')        { e.preventDefault(); nextWord(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();
    const k = key(r, c);
    if (S.input.get(k)) {
      S.input.delete(k);
      const el = cellEl(r, c); if (el) { const i = el.querySelector('input'); if (i) i.value = ''; }
    } else {
      S.dir === 'H' ? move(r, c, 0,-1) : move(r, c,-1, 0);
    }
    save();
  }
}

function kinput(e, r, c) {
  if (S.done) return;
  const raw = (e.target.value || '').toUpperCase().replace(/[^A-Z]/g, '');
  const letter = raw ? raw[raw.length - 1] : '';
  e.target.value = letter;
  const k = key(r, c);
  if (letter) {
    S.input.set(k, letter);
    const el = document.querySelector(`[data-r="${r}"][data-c="${c}"] input`);
    if (el) el.value = letter;
    S.dir === 'H' ? move(r, c, 0, 1) : move(r, c, 1, 0);
  } else {
    S.input.delete(k);
  }
  save();
}

function move(r, c, dr, dc) {
  let nr = r + dr, nc = c + dc;
  while (nr >= 1 && nr <= S.rows && nc >= 1 && nc <= S.cols) {
    if (S.grid.has(key(nr, nc))) {
      S.sel = { r: nr, c: nc };
      if (dr === 0) S.dir = 'H'; else if (dc === 0) S.dir = 'V';
      highlight(); return;
    }
    nr += dr; nc += dc;
  }
}

function nextWord(delta) {
  if (!S.sel) return;
  const entries = S.wmap.get(key(S.sel.r, S.sel.c)) || [];
  const cur = entries.find(e => S.words[e.wi].direction === S.dir) || entries[0];
  if (!cur) return;
  selectWord(((cur.wi + delta) % S.words.length + S.words.length) % S.words.length);
}

function eraseAll() {
  if (S.done) return;
  S.input.clear();
  document.querySelectorAll('.cell.white input').forEach(inp => { inp.value = ''; });
  save();
}

function verify() {
  if (S.done) return;
  let bad = 0;
  S.words.forEach(w => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'H' ? w.row : w.row + i;
      const c = w.direction === 'H' ? w.col + i : w.col;
      if ((S.input.get(key(r, c)) || '') !== w.word[i]) { bad++; return; }
    }
  });
  if (bad === 0) { S.done = true; stopTimer(); save(); openModal(); }
  else {
    S.tries++;
    updateTries();
    save();
    toast(`La grille contient ${bad} mot${bad > 1 ? 's' : ''} incorrect${bad > 1 ? 's' : ''}.`);
  }
}

function startTimer() {
  if (S.tid) return;
  S.tid = setInterval(() => { S.secs++; updateTimer(); }, 1000);
}
function stopTimer() { clearInterval(S.tid); S.tid = null; }
function updateTimer() { document.getElementById('timer').textContent = fmtTime(S.secs); }
function updateTries() {
  const el = document.getElementById('tries-badge');
  el.textContent = S.tries === 0 ? '0 essai' : `${S.tries} essai${S.tries > 1 ? 's' : ''}`;
}

function shareText() {
  return [
    `Mots Croisés du Jour 🧩`,
    `Date : ${fmtDate(S.dateStr)}`,
    `Temps : ${fmtTime(S.secs)} ⏱️`,
    `Tries : ${S.tries}`,
    `https://pabloortolan.github.io/vibeapp`
  ].join('\n');
}

function animateShareBtn(btnEl, textEl) {
  btnEl.classList.add('btn-copied');
  const orig = textEl.textContent;
  textEl.textContent = 'Copié !';
  setTimeout(() => { btnEl.classList.remove('btn-copied'); textEl.textContent = orig; }, 3000);
}

function share() {
  navigator.clipboard.writeText(shareText()).then(() => {
    animateShareBtn(document.getElementById('share-btn'), document.getElementById('share-text'));
  }).catch(() => toast('Impossible de copier.'));
}

function modalShare() {
  navigator.clipboard.writeText(shareText()).then(() => {
    animateShareBtn(document.getElementById('modal-share-btn'), document.getElementById('modal-share-text'));
  }).catch(() => toast('Impossible de copier.'));
}

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3500);
}

function openModal() {
  document.getElementById('m-time').textContent = `Temps : ${fmtTime(S.secs)}`;
  document.getElementById('m-tries').textContent =
    S.tries === 0 ? 'Résolu du premier coup !' : `${S.tries} essai${S.tries > 1 ? 's' : ''} avant la solution`;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function markDone() {
  document.querySelectorAll('.cell.white').forEach(el => el.classList.add('correct'));
}

function lsKey() { return `mc-${S.dateStr}`; }
function save() {
  const inp = {};
  S.input.forEach((v, k) => { inp[k] = v; });
  localStorage.setItem(lsKey(), JSON.stringify({ inp, secs: S.secs, done: S.done, tries: S.tries }));
}
function loadSave() {
  try {
    const raw = localStorage.getItem(lsKey());
    if (!raw) return null;
    const p = JSON.parse(raw);
    return { inp: new Map(Object.entries(p.inp || {})), secs: p.secs || 0, done: !!p.done, tries: p.tries || 0 };
  } catch(e) { return null; }
}

boot();
<\/script>
