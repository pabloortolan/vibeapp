<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mots Croisés Quotidiens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0f0f13; color: #e8e4d9; min-height: 100vh; }
  h1, h2, .serif { font-family: 'Playfair Display', serif; }

  .cell {
    width: 36px; height: 36px;
    border: 1px solid #3a3a4a;
    background: #1c1c26;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .cell.black { background: #0a0a10; border-color: #0a0a10; cursor: default; }
  .cell.active { background: #2a4a7a; border-color: #4a7acf; }
  .cell.word-active { background: #1e3050; border-color: #3a5a9a; }
  .cell.correct { background: #1a3a1a; border-color: #3a7a3a; }

  .cell input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background: transparent;
    border: none; outline: none;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600;
    color: #e8e4d9;
    text-transform: uppercase;
    cursor: pointer;
    caret-color: transparent;
  }
  .cell-num {
    position: absolute; top: 1px; left: 2px;
    font-size: 8px; line-height: 1;
    color: #7a7a9a; pointer-events: none;
    font-family: 'Inter', sans-serif;
  }

  .grid-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .crossword-grid { display: inline-grid; gap: 1px; background: #0a0a10; border: 1px solid #3a3a4a; }

  .clue-row { padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: background 0.12s; }
  .clue-row:hover { background: #1e2030; }
  .clue-row.active-clue { background: #1e3050; border-left: 3px solid #4a7acf; padding-left: 7px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 20px; border-radius: 8px; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none;
    transition: all 0.15s; user-select: none;
  }
  .btn-primary { background: #4a7acf; color: white; }
  .btn-primary:hover { background: #5a8adf; }
  .btn-secondary { background: #2a2a3a; color: #e8e4d9; border: 1px solid #3a3a4a; }
  .btn-secondary:hover { background: #3a3a4a; }
  .btn-success { background: #3a7a3a !important; color: white !important; }

  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2a1a1a; color: #e8a0a0; padding: 12px 20px; border-radius: 10px;
    border: 1px solid #5a3a3a; font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #mobile-clue-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #16161f; border-top: 1px solid #2a2a3a;
    padding: 12px 16px; z-index: 50;
    transform: translateY(100%); transition: transform 0.25s ease;
  }
  #mobile-clue-bar.visible { transform: translateY(0); }

  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #modal.show { opacity: 1; pointer-events: all; }
  #modal-box {
    background: #16161f; border: 1px solid #3a3a4a; border-radius: 16px;
    padding: 32px; max-width: 400px; width: 90%; text-align: center;
  }

  @media (max-width: 640px) {
    .cell { width: 28px; height: 28px; }
    .cell input { font-size: 12px; }
    .cell-num { font-size: 7px; }
    #clues-panel { display: none !important; }
    #toast { bottom: 90px; }
  }
</style>
</head>
<body class="p-4 md:p-8">

<!-- Header -->
<div class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-1">
    <div>
      <h1 class="serif text-2xl md:text-3xl font-bold text-amber-100">Mots Croisés Quotidiens</h1>
      <p id="theme-label" class="text-sm text-slate-400 mt-0.5"></p>
    </div>
    <div class="flex items-center gap-3 text-sm text-slate-400">
      <span id="timer-display" class="font-mono text-base text-slate-300">00:00</span>
      <span id="tries-display" class="text-xs px-2 py-1 rounded bg-slate-800 border border-slate-700">Aucune erreur</span>
    </div>
  </div>
  <div class="h-px bg-slate-700 mb-4"></div>

  <!-- Main layout -->
  <div class="flex flex-col lg:flex-row gap-6">
    <!-- Grid -->
    <div class="flex-1">
      <div class="grid-wrapper">
        <div id="crossword-grid" class="crossword-grid"></div>
      </div>
      <div class="flex gap-3 mt-4">
        <button class="btn btn-primary" onclick="verify()">Vérifier</button>
        <button id="share-btn" class="btn btn-secondary" onclick="share()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          <span id="share-btn-text">Partager</span>
        </button>
      </div>
    </div>

    <!-- Clues panel (hidden on mobile via CSS) -->
    <div id="clues-panel" class="lg:w-72 flex-shrink-0">
      <div class="mb-4">
        <h2 class="serif text-lg font-bold text-amber-100 mb-2">Horizontalement</h2>
        <div id="clues-across" class="space-y-0.5 text-sm text-slate-300"></div>
      </div>
      <div>
        <h2 class="serif text-lg font-bold text-amber-100 mb-2">Verticalement</h2>
        <div id="clues-down" class="space-y-0.5 text-sm text-slate-300"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Mobile clue bar -->
<div id="mobile-clue-bar">
  <p class="text-xs text-slate-500 mb-1" id="mobile-clue-label"></p>
  <p class="text-sm text-slate-200 font-medium" id="mobile-clue-text"></p>
</div>

<!-- Success modal -->
<div id="modal">
  <div id="modal-box">
    <div class="text-4xl mb-3">&#x26F3;</div>
    <h2 class="serif text-2xl font-bold text-amber-100 mb-1">Bravo !</h2>
    <p class="text-slate-400 text-sm mb-2" id="modal-time"></p>
    <p class="text-slate-400 text-sm mb-5" id="modal-tries"></p>
    <button class="btn btn-primary w-full" onclick="closeModal()">Fermer</button>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  dateStr: '', theme: '',
  gridSize: { rows: 0, cols: 0 },
  words: [],
  gridMap: new Map(),  // "r,c" -> correct letter
  numMap: new Map(),   // "r,c" -> clue number
  wordMap: new Map(),  // "r,c" -> [{wordIdx, pos}]
  userInput: new Map(),
  sel: null,
  dir: 'H',
  secs: 0, timerID: null, done: false,
  tries: 0
};

// ─── Date ─────────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ─── Load puzzle ──────────────────────────────────────────────────────────────
async function loadPuzzle() {
  S.dateStr = todayStr();
  let data = null;
  try {
    const r = await fetch(`data/${S.dateStr}.json`);
    if (r.ok) data = await r.json();
  } catch(e) {}
  if (!data) {
    try {
      const r = await fetch('data/golf-fallback.json');
      if (r.ok) data = await r.json();
    } catch(e) {}
  }
  if (!data) {
    document.body.innerHTML = '<p class="p-8 text-red-400">Impossible de charger le puzzle.</p>';
    return;
  }
  initPuzzle(data);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function initPuzzle(data) {
  S.theme = data.theme || '';
  S.gridSize = data.gridSize;
  S.words = data.words.map(w => ({ ...w, word: w.word.toUpperCase() }));

  document.getElementById('theme-label').textContent = S.theme ? `Thème : ${S.theme}` : '';

  S.gridMap.clear(); S.numMap.clear(); S.wordMap.clear();

  S.words.forEach((w, wi) => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'H' ? w.row : w.row + i;
      const c = w.direction === 'H' ? w.col + i : w.col;
      const key = `${r},${c}`;
      S.gridMap.set(key, w.word[i]);
      if (!S.wordMap.has(key)) S.wordMap.set(key, []);
      S.wordMap.get(key).push({ wordIdx: wi, pos: i });
    }
  });

  // Assign clue numbers sorted by row then col
  const seen = new Map();
  let num = 1;
  const starts = S.words.map((w, wi) => ({ r: w.row, c: w.col, wi }))
    .sort((a, b) => a.r !== b.r ? a.r - b.r : a.c - b.c);

  starts.forEach(({ r, c, wi }) => {
    const key = `${r},${c}`;
    if (!seen.has(key)) { seen.set(key, num); S.numMap.set(key, num); num++; }
    S.words[wi].num = seen.get(key);
  });

  const saved = loadProgress();
  S.userInput = saved ? saved.inp : new Map();
  S.secs      = saved ? saved.secs : 0;
  S.done      = saved ? saved.done : false;
  S.tries     = saved ? (saved.tries || 0) : 0;

  renderGrid();
  renderClues();
  updateTriesDisplay();
  updateTimerDisplay();

  if (!S.done) startTimer();
  else showDoneState();
}

// ─── Grid rendering ───────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('crossword-grid');
  const { rows, cols } = S.gridSize;
  grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  grid.innerHTML = '';

  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const key = `${r},${c}`;
      const div = document.createElement('div');
      div.className = 'cell' + (S.gridMap.has(key) ? '' : ' black');
      div.dataset.r = r; div.dataset.c = c;

      if (S.gridMap.has(key)) {
        const num = S.numMap.get(key);
        if (num) {
          const n = document.createElement('span');
          n.className = 'cell-num';
          n.textContent = num;
          div.appendChild(n);
        }
        const inp = document.createElement('input');
        inp.type = 'text'; inp.maxLength = 1;
        inp.autocomplete = 'off'; inp.autocorrect = 'off';
        inp.autocapitalize = 'characters'; inp.spellcheck = false;
        inp.value = S.userInput.get(key) || '';
        inp.addEventListener('mousedown', e => { e.preventDefault(); onCellClick(r, c); });
        inp.addEventListener('touchstart', e => { e.preventDefault(); onCellClick(r, c); }, { passive: false });
        inp.addEventListener('keydown', e => onKeyDown(e, r, c));
        inp.addEventListener('input', e => onInput(e, r, c));
        div.appendChild(inp);
      }
      grid.appendChild(div);
    }
  }
  highlightSelection();
}

function getCell(r, c) {
  return document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function highlightSelection() {
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('active', 'word-active'));
  if (!S.sel) return;
  const { r, c } = S.sel;
  const entries = S.wordMap.get(`${r},${c}`) || [];
  const entry = entries.find(e => S.words[e.wordIdx].direction === S.dir) || entries[0];

  if (entry) {
    const w = S.words[entry.wordIdx];
    for (let i = 0; i < w.word.length; i++) {
      const wr = w.direction === 'H' ? w.row : w.row + i;
      const wc = w.direction === 'H' ? w.col + i : w.col;
      const el = getCell(wr, wc);
      if (el) el.classList.add('word-active');
    }
    updateMobileClue(w);
    highlightClue(entry.wordIdx);
  }

  const selEl = getCell(r, c);
  if (selEl) { selEl.classList.remove('word-active'); selEl.classList.add('active'); }
  focusCell(r, c);
}

function focusCell(r, c) {
  const el = getCell(r, c);
  if (el) { const inp = el.querySelector('input'); if (inp) inp.focus({ preventScroll: true }); }
}

// ─── Clue rendering ───────────────────────────────────────────────────────────
function renderClues() {
  const across = document.getElementById('clues-across');
  const down   = document.getElementById('clues-down');
  across.innerHTML = ''; down.innerHTML = '';

  S.words.forEach((w, wi) => {
    const div = document.createElement('div');
    div.className = 'clue-row';
    div.dataset.wi = wi;
    div.innerHTML = `<span class="font-semibold text-slate-400">${w.num}.</span> ${w.clue}`;
    div.addEventListener('click', () => selectWord(wi));
    (w.direction === 'H' ? across : down).appendChild(div);
  });
}

function highlightClue(wi) {
  document.querySelectorAll('.clue-row').forEach(el => el.classList.remove('active-clue'));
  const el = document.querySelector(`.clue-row[data-wi="${wi}"]`);
  if (el) { el.classList.add('active-clue'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function selectWord(wi) {
  const w = S.words[wi];
  S.sel = { r: w.row, c: w.col };
  S.dir = w.direction;
  highlightSelection();
}

// ─── Mobile clue bar ──────────────────────────────────────────────────────────
function updateMobileClue(w) {
  document.getElementById('mobile-clue-label').textContent =
    `${w.num}. ${w.direction === 'H' ? 'Horizontalement' : 'Verticalement'}`;
  document.getElementById('mobile-clue-text').textContent = w.clue;
  document.getElementById('mobile-clue-bar').classList.add('visible');
}

// ─── Cell interaction ─────────────────────────────────────────────────────────
function onCellClick(r, c) {
  const key = `${r},${c}`;
  if (!S.gridMap.has(key) || S.done) return;

  if (S.sel && S.sel.r === r && S.sel.c === c) {
    const dirs = new Set((S.wordMap.get(key) || []).map(e => S.words[e.wordIdx].direction));
    if (dirs.size > 1) S.dir = S.dir === 'H' ? 'V' : 'H';
  } else {
    S.sel = { r, c };
    const entries = S.wordMap.get(key) || [];
    if (entries.length && !entries.find(e => S.words[e.wordIdx].direction === S.dir))
      S.dir = S.words[entries[0].wordIdx].direction;
  }
  highlightSelection();
}

function onKeyDown(e, r, c) {
  if (S.done) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); moveDir(r, c, 0, 1); return; }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); moveDir(r, c, 0,-1); return; }
  if (e.key === 'ArrowDown')  { e.preventDefault(); moveDir(r, c, 1, 0); return; }
  if (e.key === 'ArrowUp')    { e.preventDefault(); moveDir(r, c,-1, 0); return; }
  if (e.key === 'Tab') { e.preventDefault(); advanceWord(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();
    const key = `${r},${c}`;
    if (S.userInput.get(key)) {
      S.userInput.delete(key);
      const el = getCell(r, c);
      if (el) { const inp = el.querySelector('input'); if (inp) inp.value = ''; }
    } else {
      S.dir === 'H' ? moveDir(r, c, 0,-1) : moveDir(r, c,-1, 0);
    }
    saveProgress();
  }
}

function onInput(e, r, c) {
  if (S.done) return;
  const val = (e.target.value || '').toUpperCase().replace(/[^A-Z]/g, '');
  e.target.value = val ? val[val.length - 1] : '';
  const letter = e.target.value;
  const key = `${r},${c}`;
  if (letter) {
    S.userInput.set(key, letter);
    S.dir === 'H' ? moveDir(r, c, 0, 1) : moveDir(r, c, 1, 0);
  } else {
    S.userInput.delete(key);
  }
  saveProgress();
}

function moveDir(r, c, dr, dc) {
  const { rows, cols } = S.gridSize;
  let nr = r + dr, nc = c + dc;
  while (nr >= 1 && nr <= rows && nc >= 1 && nc <= cols) {
    if (S.gridMap.has(`${nr},${nc}`)) {
      S.sel = { r: nr, c: nc };
      if (dr === 0) S.dir = 'H'; else if (dc === 0) S.dir = 'V';
      highlightSelection(); return;
    }
    nr += dr; nc += dc;
  }
}

function advanceWord(delta) {
  if (!S.sel) return;
  const entries = S.wordMap.get(`${S.sel.r},${S.sel.c}`) || [];
  const cur = entries.find(e => S.words[e.wordIdx].direction === S.dir) || entries[0];
  if (!cur) return;
  const next = ((cur.wordIdx + delta) % S.words.length + S.words.length) % S.words.length;
  selectWord(next);
}

// ─── Verify ───────────────────────────────────────────────────────────────────
function verify() {
  if (S.done) return;
  let errorWords = 0;
  S.words.forEach(w => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'H' ? w.row : w.row + i;
      const c = w.direction === 'H' ? w.col + i : w.col;
      if ((S.userInput.get(`${r},${c}`) || '') !== w.word[i]) { errorWords++; return; }
    }
  });

  if (errorWords === 0) {
    S.done = true; stopTimer(); saveProgress(); showModal();
  } else {
    S.tries++;
    updateTriesDisplay();
    saveProgress();
    showToast(`La grille contient ${errorWords} mot${errorWords > 1 ? 's' : ''} incorrect${errorWords > 1 ? 's' : ''}.`);
  }
}

function updateTriesDisplay() {
  document.getElementById('tries-display').textContent =
    S.tries === 0 ? 'Aucune erreur' : `${S.tries} essai${S.tries > 1 ? 's' : ''}`;
}

// ─── Timer ────────────────────────────────────────────────────────────────────
function startTimer() {
  if (S.timerID) return;
  S.timerID = setInterval(() => { S.secs++; updateTimerDisplay(); }, 1000);
}

function stopTimer() { clearInterval(S.timerID); S.timerID = null; }

function updateTimerDisplay() {
  const m = String(Math.floor(S.secs / 60)).padStart(2, '0');
  const s = String(S.secs % 60).padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return m === 0 ? `${s}s` : `${m}m${String(s).padStart(2,'0')}s`;
}

// ─── Share ────────────────────────────────────────────────────────────────────
function share() {
  const text = [
    `\u{1F3CC}️ Mots Croisés — ${S.theme}`,
    `\u{1F4C5} ${S.dateStr}`,
    `⏱ ${formatTime(S.secs)}`,
    `\u{1F3AF} ${S.tries === 0 ? 'Sans erreur !' : `${S.tries} essai${S.tries > 1 ? 's' : ''}`}`,
    '',
    'https://pabloortolan.github.io/vibeapp'
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('share-btn');
    const txt = document.getElementById('share-btn-text');
    btn.classList.add('btn-success');
    txt.textContent = 'Copié !';
    setTimeout(() => { btn.classList.remove('btn-success'); txt.textContent = 'Partager'; }, 3000);
  }).catch(() => showToast('Impossible de copier.'));
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function showModal() {
  document.getElementById('modal-time').textContent = `Temps : ${formatTime(S.secs)}`;
  document.getElementById('modal-tries').textContent =
    S.tries === 0 ? 'Résolu du premier coup !' : `${S.tries} essai${S.tries > 1 ? 's' : ''} avant la solution.`;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function showDoneState() {
  document.querySelectorAll('.cell:not(.black)').forEach(el => el.classList.add('correct'));
}

// ─── Persistence ──────────────────────────────────────────────────────────────
function lsKey() { return `mots-croises-${S.dateStr}`; }

function saveProgress() {
  const inp = {};
  S.userInput.forEach((v, k) => { inp[k] = v; });
  localStorage.setItem(lsKey(), JSON.stringify({ inp, secs: S.secs, done: S.done, tries: S.tries }));
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(lsKey());
    if (!raw) return null;
    const p = JSON.parse(raw);
    return { inp: new Map(Object.entries(p.inp || {})), secs: p.secs || 0, done: !!p.done, tries: p.tries || 0 };
  } catch(e) { return null; }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadPuzzle();
</script>
</body>
</html>
